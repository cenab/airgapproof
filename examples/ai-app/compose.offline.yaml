services:
  api:
    image: airgapproof-demo:offline
    build:
      context: .
      target: bundled
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://demo:demo@postgres:5432/demo
      REDIS_URL: redis://redis:6379
      INFERENCE_URL: http://inference:8080
  inference:
    image: airgapproof-demo:offline
    command: [uvicorn, inference:app, --host, 0.0.0.0, --port, '8080']
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    healthcheck:
      test: [CMD-SHELL, pg_isready -U demo -d demo]
      interval: 1s
      timeout: 2s
      retries: 30
    volumes: [data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 2s
      retries: 30
volumes:
  data: {}
