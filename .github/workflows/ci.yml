name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - run: make check
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - name: Enable syscall tracepoints
        run: |
          if ! mountpoint -q /sys/kernel/tracing; then
            sudo mount -t tracefs tracefs /sys/kernel/tracing
          fi
      - run: go install sigs.k8s.io/kind@v0.33.0
      - run: make demo
      - name: Exercise failed raw-IP attempts, attribution, cleanup, and team access
        env:
          AIRGAPPROOF_INTEGRATION: '1'
          AIRGAPPROOF_REQUIRE_TRACING: '1'
        run: go test -v ./internal/run ./internal/dashboard -timeout 8m
      - run: bin/airgapproof prepare --config examples/kubernetes/airgapproof.yaml
      - name: Exercise Kubernetes isolation and recovery
        run: bin/airgapproof test --config examples/kubernetes/airgapproof.yaml --report reports/kubernetes --timeout 8m
      - name: Verify portable bundles and signing
        run: |
          bin/airgapproof bundle export --config examples/ai-app/airgapproof.yaml --output dist/offline-bundle
          bin/airgapproof bundle verify dist/offline-bundle
          bin/airgapproof bundle load dist/offline-bundle
          bin/airgapproof test --config dist/offline-bundle/airgapproof.yaml --report reports/bundle
          bin/airgapproof keygen --output /tmp/airgapproof-evidence.key
          bin/airgapproof sign reports/bundle/report.json --key /tmp/airgapproof-evidence.key --output reports/bundle/signed.json
          bin/airgapproof verify reports/bundle/signed.json --public-key /tmp/airgapproof-evidence.key.pub
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: offline-evidence
          path: reports/
  disconnected-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils xorriso
      - run: make build helper
      - name: Provision online, then test a guest without a NIC
        run: sh scripts/check-vm.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: disconnected-evidence
          path: |
            reports/vm-smoke/
            reports/vm-kubernetes/
