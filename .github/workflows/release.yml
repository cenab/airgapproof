name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - run: make check
      - name: Build portable CLI archives
        run: |
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              package="airgapproof_${GITHUB_REF_NAME}_${os}_${arch}"
              mkdir -p "dist/$package"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-X main.version=${GITHUB_REF_NAME#v}" -o "dist/$package/airgapproof" ./cmd/airgapproof
              cp README.md LICENSE "dist/$package/"
              cp -r docs "dist/$package/"
              cp -r licenses "dist/$package/"
              tar -C dist -czf "dist/$package.tar.gz" "$package"
            done
          done
          for arch in amd64 arm64; do
            version="${GITHUB_REF_NAME#v}"
            docker build --platform "linux/$arch" -f Dockerfile.helper -t "ghcr.io/cenab/airgapproof-helper:$version" .
            docker image save --platform "linux/$arch" "ghcr.io/cenab/airgapproof-helper:$version" | gzip > "dist/airgapproof-helper_${GITHUB_REF_NAME}_linux_${arch}.tar.gz"
            docker build --platform "linux/$arch" -t "ghcr.io/cenab/airgapproof:$version" .
            docker image save --platform "linux/$arch" "ghcr.io/cenab/airgapproof:$version" | gzip > "dist/airgapproof-dashboard_${GITHUB_REF_NAME}_linux_${arch}.tar.gz"
          done
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binaries
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - file: Dockerfile
            image: airgapproof
          - file: Dockerfile.helper
            image: airgapproof-helper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image version
        run: echo "IMAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ env.IMAGE_VERSION }}
  publish:
    needs: [binaries, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download CLI archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "$GITHUB_RUN_ID" --name release-binaries --dir dist
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --title "AirgapProof $GITHUB_REF_NAME" --notes-file docs/release-notes.md --prerelease
